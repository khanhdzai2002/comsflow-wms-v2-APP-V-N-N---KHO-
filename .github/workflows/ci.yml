name: Validate ComsFlow v2
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: comsflow
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: comsflow_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comsflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://comsflow:ci-test-only@127.0.0.1:5432/comsflow_v2_test
      DATABASE_URL: postgresql://comsflow:ci-test-only@127.0.0.1:5432/comsflow_v2_test
      SUPABASE_URL: http://127.0.0.1:55439
      SUPABASE_ANON_KEY: ci-public-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
      APP_ORIGIN: http://localhost:5173
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:worker
      - run: npx wrangler deploy --dry-run
      - run: npx playwright install --with-deps chromium
      - name: Browser regression (API fixtures)
        run: |
          npm run dev -- --port 5173 > /tmp/comsflow-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
